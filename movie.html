<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awvyyy Cinema — Фильм</title>

<style>
:root {
  --bg: #0b1220;
  --card: #111827;
  --text: #f1f5f9;
  --muted: #cbd5e1;
  --brand: #2563eb;
  --brand-light: #60a5fa;
  --border: #1e293b;
  --seat-free:#1f2937;
  --seat-picked:#60a5fa;
  --seat-reserved:#374151;
  --seat-hover:#3b82f6;
}

*{box-sizing:border-box}
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto;
  background: var(--bg);
  color: var(--text);
}

/* HEADER */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 26px;
  z-index: 50;
  background: rgba(2,6,23,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(148,163,184,0.25);
}

header .logo {
  font-weight: 700;
  font-size: 20px;
}

header a {
  color: var(--text);
  text-decoration: none;
  font-size: 15px;
  opacity: .9;
}

header a:hover { opacity: 1; }

main {
  margin-top: 64px;
}

/* HERO */
.hero {
  position: relative;
  width: 100%;
  height: calc(100vh - 64px);
  min-height: 520px;
  overflow: hidden;
}

.hero-bg {
  position:absolute;
  inset:0;
}

.hero-bg img {
  width: 100%;
  height: 100%;
  display:block;
  object-fit: cover;
  object-position: center top;
  filter: brightness(0.8);
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to bottom,
      rgba(4,7,18,0.15) 0%,
      rgba(4,7,18,0.8) 70%,
      var(--bg) 100%);
}

.hero-content {
  position: absolute;
  left: 60px;
  bottom: 60px;
  max-width: 60%;
}

.hero-title {
  font-size: 46px;
  font-weight: 800;
  margin-bottom: 10px;
}

.hero-meta {
  font-size: 17px;
  opacity: .9;
  display: flex;
  flex-wrap:wrap;
  gap: 16px;
}

/* SECTIONS */
.section {
  max-width: 1050px;
  margin: 40px auto;
  padding: 0 20px;
}

.section h2 {
  margin-bottom: 14px;
  font-size: 26px;
  font-weight: 700;
}

/* DESCRIPTION */
.description {
  line-height: 1.65;
  font-size: 17px;
  color: var(--muted);
  margin-top: 10px;
}

/* ACTORS */
.actors {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
}

.actor {
  text-align: center;
  background:#020617;
  border-radius:14px;
  padding:10px 6px;
  border:1px solid rgba(15,23,42,0.8);
}

.actor img {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 8px;
}

.actor-name {
  font-size: 14px;
}

.actor-role {
  font-size: 12px;
  color: var(--muted);
}

/* BUTTONS */
.btn {
  background: var(--brand);
  color: white;
  padding: 10px 16px;
  font-size: 16px;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  transition: .2s;
}

.btn:hover {
  background: var(--brand-light);
}

/* TRAILER modal */
#trailerModal {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  z-index: 200;
}

#trailerModal.open {
  display: grid;
}

#trailerFrame {
  width: 80vw;
  height: 45vw;
  max-width: 900px;
  max-height: 505px;
  border-radius: 16px;
  border: none;
}

/* SHOWTIMES */
.showday {
  margin-bottom: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #020617;
  border: 1px solid rgba(148,163,184,0.3);
}

.showday-date {
  font-weight: 600;
  margin-bottom: 6px;
}

.showday-times {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.showtime-btn {
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,0.5);
  background: transparent;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  transition: .15s;
}

.showtime-btn:hover {
  background: var(--brand);
  border-color: var(--brand);
}

/* Similar movies on movie page */
.similar-card {
  cursor: pointer;
  text-align:center;
}

.similar-card img {
  width: 120px;
  height: 170px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 6px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.6);
}

.similar-card .name {
  font-size: 14px;
}

/* === Seat picker modal (как на главной) === */
.modal{position:fixed;inset:0;display:none}
.modal.open{display:grid;place-items:center}
.modal .overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,.6);
}
.modal .content{
  position:relative;z-index:1;
  width:min(920px,92vw);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.8);
  padding:18px;
}
.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:8px;
}
.modal-title{font-weight:700}
.modal-sub{font-size:12px;color:var(--muted)}
.screen{
  background:linear-gradient(180deg,rgba(148,163,184,.4),transparent);
  color:var(--muted);
  text-align:center;
  padding:6px;
  border-radius:10px;
  margin-bottom:12px;
  font-size:12px;
  letter-spacing:.08em;
}
.seats{display:grid;gap:10px;justify-content:center}
.row-seats{display:flex;gap:8px;justify-content:center}
.seat{
  width:28px;height:28px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--seat-free);
  display:grid;place-items:center;
  font-size:11px;
  cursor:pointer;
  user-select:none;
  transition:transform .1s ease, background .2s ease, box-shadow .2s ease, color .2s;
  color:var(--text);
}
.seat:hover{
  transform:translateY(-1px);
  box-shadow:0 2px 6px rgba(15,23,42,.7);
  background:var(--seat-hover);
  color:#fff;
}
.seat.picked{
  background:var(--seat-picked);
  color:#fff;
  border-color:transparent;
  box-shadow:0 2px 8px rgba(15,23,42,.9);
}
.seat.reserved{
  background:var(--seat-reserved);
  color:#9ca3af;
  border-style:dashed;
  cursor:not-allowed;
  opacity:.7;
}
.legend{
  display:flex;gap:10px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}
.legend .dot{
  width:14px;height:14px;
  border-radius:4px;
  display:inline-block;
  margin-right:6px;
  border:1px solid var(--border);
}
.legend .free{background:var(--seat-free)}
.legend .pick{background:var(--seat-picked)}
.legend .res{background:var(--seat-reserved)}
.modal-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
  justify-content:flex-end;
  align-items:center;
}

/* Toast */
#toastContainer{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:250;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.toast{
  min-width:220px;
  max-width:280px;
  padding:10px 12px;
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  box-shadow:0 4px 12px rgba(0,0,0,.7);
  border:1px solid var(--border);
  font-size:12px;
  opacity:0;
  transform:translateY(10px);
  transition:all .25s ease;
}
.toast.show{opacity:1;transform:translateY(0)}

@media (max-width: 800px){
  .hero-content{
    left:20px;
    right:20px;
    bottom:30px;
    max-width:90%;
  }
  .hero-title{font-size:32px}
}
</style>
</head>

<body>

<header>
  <div class="logo">🍿 Awvyyy Cinema</div>
  <nav>
    <a href="index.html">← Назад к сеансам</a>
  </nav>
</header>

<main>

<div class="hero">
  <div class="hero-bg">
    <img id="moviePoster" src="" alt="">
  </div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div id="movieTitle" class="hero-title">Загрузка…</div>
    <div class="hero-meta">
      <span id="movieYear"></span>
      <span id="movieDur"></span>
      <span id="movieRating"></span>
      <span id="movieAge"></span>
    </div>

    <button class="btn" id="playTrailer" style="margin-top:20px;">
      ▶ Смотреть трейлер
    </button>
  </div>
</div>

<div class="section">
  <h2>Описание</h2>
  <div id="movieDesc" class="description">Загрузка…</div>
</div>

<div class="section">
  <h2>Актёры</h2>
  <div id="actorList" class="actors"></div>
</div>

<div class="section">
  <h2>Выбери сеанс</h2>
  <div id="showtimeList">Загрузка…</div>
</div>

<div class="section">
  <h2>Похожие фильмы</h2>
  <div id="similarList" class="actors"></div>
</div>

</main>

<!-- TRAILER MODAL -->
<div id="trailerModal">
  <iframe id="trailerFrame" allowfullscreen></iframe>
</div>

<!-- Модалка выбора мест (та же логика, что на главной) -->
<div id="seatModal" class="modal" aria-hidden="true">
  <div class="overlay" data-close></div>
  <div class="content">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="seatTitle">Выбор мест</div>
        <div class="modal-sub" id="seatSub"></div>
      </div>
      <button class="btn" data-close>✖</button>
    </div>
    <div class="screen">ЭКРАН</div>
    <div id="seatGrid" class="seats"></div>
    <div class="legend">
      <span><span class="dot free"></span>Свободно</span>
      <span><span class="dot pick"></span>Вы выбрали</span>
      <span><span class="dot res"></span>Занято / в бронях</span>
    </div>
    <div class="modal-actions">
      <div class="muted" id="seatSummary">Места не выбраны</div>
      <button class="btn" id="applySeats" disabled>Добавить в корзину</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toastContainer"></div>

<script src="movie.js"></script>
</body>
</html>
