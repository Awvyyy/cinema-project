<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Awvyyy Cinema</title>
<style>
  :root {
    --bg:#f7f7fb;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e5e7eb;
    --accent:#f1f5f9;
    --brand:#2563eb;
    --brand-hover:#1d4ed8;
    --shadow:rgba(15,23,42,0.08);
  }
  [data-theme="dark"] {
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#334155;
    --accent:#1e293b;
    --shadow:rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
  .container{max-width:1100px;margin:0 auto;padding:20px}
  header.sticky{position:sticky;top:0;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:50;box-shadow:0 2px 4px var(--shadow);transition:background .3s}
  [data-theme="dark"] header.sticky{background:rgba(15,23,42,.9)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .select,.input,.btn{border:1px solid var(--border);background:var(--card);padding:10px 12px;border-radius:12px;font-size:14px;transition:.2s}
  .btn{cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{background:var(--brand-hover)}
  .btn.ghost{background:var(--card)}
  .btn.ghost:hover{background:var(--accent)}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:var(--accent);font-size:12px;color:var(--muted);border:1px solid var(--border)}
  .grid{display:grid;gap:16px}
  @media(min-width:720px){.grid.cols-3{grid-template-columns:repeat(3,1fr)}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 3px 8px var(--shadow);transition:transform .25s,box-shadow .25s;opacity:0;animation:fadeIn .4s ease forwards}
  .card:hover{transform:translateY(-6px);box-shadow:0 8px 16px var(--shadow)}
  .card .media{aspect-ratio:3/4;width:100%;background:linear-gradient(135deg,#60a5fa,#9333ea);display:grid;place-items:center;font-weight:700;color:#fff;font-size:24px}
  .card .body{padding:12px 14px}
  .muted{color:var(--muted)}
  .title{font-weight:700}
  .times{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .time{padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;transition:.2s}
  .time:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 2px 8px var(--shadow)}
  .drawer{position:fixed;inset:0;display:none}
  .drawer.open{display:block}
  .drawer .overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fadeIn .3s}
  .drawer .panel{position:absolute;right:0;top:80px;bottom:0;width:100%;max-width:400px;border-left:1px solid var(--border);background:var(--card);overflow:auto;border-radius:16px 0 0 0;box-shadow:-5px 0 10px var(--shadow);animation:fadeIn .3s}
  .cart-item{display:flex;gap:10px;border:1px solid var(--border);border-radius:14px;padding:10px;background:var(--accent);transition:.2s}
  .cart-item:hover{background:var(--card)}
  .poster{width:60px;height:80px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#9333ea);color:#fff;font-weight:700}
  .footer{border-top:1px solid var(--border);padding-top:10px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header class="sticky">
  <div class="container row" style="justify-content:space-between">
    <div class="badge"><strong>🍿 Awvyyy Cinema</strong></div>
    <div class="row">
      <button id="themeToggle" class="btn ghost" title="Сменить тему">🌙</button>
      <button id="cartBtn" class="btn ghost">🛒 Корзина <span id="cartCount" class="badge">0</span></button>
    </div>
  </div>
</header>

<main class="container">
  <section class="panel">
    <div class="title" style="font-size:22px">Найди сеанс сегодня</div>
    <p class="muted">Выбирай город, кинотеатр и дату. Добавляй билеты в корзину — проведи свой вечер с кайфом 🎬</p>
    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px">
      <select id="city" class="select"></select>
      <select id="theater" class="select"></select>
      <div id="dates" class="row" style="gap:8px"></div>
      <input id="search" class="input" placeholder="Поиск: фильм или формат"/>
    </div>
    <div style="margin-top:12px">Цена билета: <strong id="basePrice"></strong></div>
  </section>

  <section style="margin-top:20px">
    <div id="movies" class="grid cols-3"></div>
  </section>
</main>

<div id="drawer" class="drawer" aria-hidden="true">
  <div class="overlay" data-close></div>
  <aside class="panel">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="title">Корзина</div>
      <button class="btn ghost" data-close>✖</button>
    </div>
    <div id="cartList" style="margin-top:12px;display:grid;gap:10px"></div>
    <div class="footer">
      <div class="title">Итого: <span id="cartTotal">€0.00</span></div>
      <button class="btn primary" id="checkout">Перейти к оплате</button>
    </div>
  </aside>
</div>

<script>
let DATA={},CITIES=[],THEATERS={},MOVIES=[],SHOWTIMES={},BASE_PRICE=0;
const TODAY=new Date().toISOString().slice(0,10);
const LS_KEY="Awvy-cart",THEME_KEY="Awvy-theme";
const state={city:"",theater:"",date:TODAY,query:"",cart:[]};

const fmtCurrency=n=>new Intl.NumberFormat(undefined,{style:"currency",currency:"EUR"}).format(n);
const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

async function loadData(){
  const res=await fetch("data.json");DATA=await res.json();
  ({cities:CITIES,theaters:THEATERS,movies:MOVIES,showtimes:SHOWTIMES,base_price:BASE_PRICE}=DATA);
  state.city=CITIES[0].id;state.theater=THEATERS[state.city][0].id;state.cart=loadCart();
  init();
}
function init(){
  $("#basePrice").textContent=fmtCurrency(BASE_PRICE);
  fillCities();fillTheaters();fillDates();
  $("#search").addEventListener("input",e=>{state.query=e.target.value.trim().toLowerCase();renderMovies();});
  $("#cartBtn").addEventListener("click",openCart);
  $$("#drawer [data-close]").forEach(b=>b.addEventListener("click",closeCart));
  $("#checkout").addEventListener("click",()=>alert("Оплата недоступна в демо-версии"));
  $("#themeToggle").addEventListener("click",toggleTheme);
  applyTheme(loadTheme());
  updateCartBadge();renderMovies();
}
function fillCities(){const el=$("#city");el.innerHTML=CITIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");el.value=state.city;el.onchange=e=>{state.city=e.target.value;fillTheaters();renderMovies();};}
function fillTheaters(){const el=$("#theater");const list=THEATERS[state.city]||[];el.innerHTML=list.map(t=>`<option value="${t.id}">${t.name}</option>`).join("");state.theater=list[0]?.id||"";el.value=state.theater;el.onchange=e=>{state.theater=e.target.value;renderMovies();};}
function fillDates(){const wrap=$("#dates");wrap.innerHTML=[0,1,2].map(i=>{const d=new Date();d.setDate(d.getDate()+i);const iso=d.toISOString().slice(0,10);const lbl=d.toLocaleDateString(undefined,{weekday:"short",day:"2-digit",month:"short"});return `<button class="btn" data-date="${iso}" ${iso===state.date?"style='background:var(--brand);color:#fff;border-color:var(--brand)'":""}>${lbl}</button>`;}).join("");wrap.onclick=e=>{const btn=e.target.closest("button[data-date]");if(!btn)return;state.date=btn.dataset.date;$$("#dates button").forEach(b=>b.removeAttribute("style"));btn.style.background="var(--brand)";btn.style.color="#fff";renderMovies();};}
function matchesQuery(m){return!state.query||(m.title+" "+m.tags.join(" ")).toLowerCase().includes(state.query);}
function getTimes(id){return(SHOWTIMES?.[state.date]?.[state.theater]?.[id])||[];}
function movieCard(m){const t=getTimes(m.id);return `<article class="card"><div class="media">${m.title.split(" ")[0]}</div><div class="body"><div class="title">${m.title}</div><div class="muted" style="font-size:12px">Возраст: ${m.age} · ${m.durationMin} мин · ⭐ ${m.rating}</div><p class="muted" style="margin-top:8px">${m.synopsis}</p><div class="times">${t.length?t.map(x=>`<button class="time" data-add='${JSON.stringify({movieId:m.id,time:x})}'>${x}</button>`).join(""):`<span class="muted">Нет сеансов</span>`}</div></div></article>`;}
function renderMovies(){const list=MOVIES.filter(matchesQuery);$("#movies").innerHTML=list.map(movieCard).join("");$$(".time").forEach(b=>b.onclick=()=>{const p=JSON.parse(b.dataset.add);addToCart(p.movieId,p.time);});}
function loadCart(){try{return JSON.parse(localStorage.getItem(LS_KEY))||[];}catch{return[];}}
function saveCart(){localStorage.setItem(LS_KEY,JSON.stringify(state.cart));updateCartBadge();}
function updateCartBadge(){$("#cartCount").textContent=state.cart.length;}
function addToCart(mid,time){const m=MOVIES.find(x=>x.id===mid);if(!m)return;const thName=(THEATERS[state.city]||[]).find(t=>t.id===state.theater)?.name||"";state.cart.unshift({id:`${mid}-${state.date}-${time}-${Math.random().toString(36).slice(2,7)}`,movieId:mid,title:m.title,date:state.date,time,qty:1,price:BASE_PRICE,theaterName:thName});saveCart();openCart();renderCart();}
function renderCart(){const w=$("#cartList");if(state.cart.length===0){w.innerHTML=`<div class="muted">Корзина пуста.</div>`;return;}w.innerHTML=state.cart.map(it=>`<div class="cart-item"><div class="poster">${it.title.split(" ")[0]}</div><div style="flex:1"><div class="title">${it.title}</div><div class="muted" style="font-size:12px">${new Date(it.date).toLocaleDateString()} · ${it.time} · ${it.theaterName}</div><div style="margin-top:4px">Билетов:<button class="btn ghost" data-dec="${it.id}">−</button><strong>${it.qty}</strong><button class="btn ghost" data-inc="${it.id}">+</button></div><div class="title" style="margin-top:6px">${fmtCurrency(it.price*it.qty)}</div></div><button class="btn ghost" data-del="${it.id}">🗑️</button></div>`).join("");const total=state.cart.reduce((s,i)=>s+i.price*i.qty,0);$("#cartTotal").textContent=fmtCurrency(total);$$("#cartList [data-del]").forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(x=>x.id!==b.dataset.del);saveCart();renderCart();});$$("#cartList [data-inc]").forEach(b=>b.onclick=()=>changeQty(b.dataset.inc,1));$$("#cartList [data-dec]").forEach(b=>b.onclick=()=>changeQty(b.dataset.dec,-1));}
function changeQty(id,d){const it=state.cart.find(x=>x.id===id);if(!it)return;it.qty=Math.max(1,it.qty+d);saveCart();renderCart();}
function openCart(){$("#drawer").classList.add("open");renderCart();}
function closeCart(){$("#drawer").classList.remove("open");}
function toggleTheme(){const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";applyTheme(t);saveTheme(t);}
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("#themeToggle").textContent=t==="dark"?"☀️":"🌙";}
function saveTheme(t){localStorage.setItem(THEME_KEY,t);}
function loadTheme(){return localStorage.getItem(THEME_KEY)||"light";}
document.addEventListener("DOMContentLoaded",loadData);
</script>
</body>
</html>
